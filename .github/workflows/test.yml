name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bats:
    name: Config Validation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run config validation tests
        run: bats tests/pr_*.bats tests/generate.bats tests/sh_reexec.bats

  windows-installer:
    name: Windows PowerShell Installer
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Parse installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Run native Windows dry-run
        shell: powershell
        run: .\install.ps1 -DryRun -Yes

      - name: Install StyLua without compiling Rust
        shell: bash
        run: |
          source lib/common.sh
          source lib/install.sh
          install_stylua_if_needed
          stylua --version
